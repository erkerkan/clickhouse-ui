name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Context first, solution second. Helps us avoid building the wrong thing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the ideal behaviour look like? Mock-ups / API sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem (including doing nothing).
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      description: Does this feel like Community (free, read-only) or Pro (write/admin) territory?
      options:
        - "Community"
        - "Pro"
        - "Not sure"
    validations:
      required: true
